[project]
name = "pv-solar-api"
version = "0.1.0"
description = "FastAPI middleware for Huawei FusionSolar PV monitoring and control"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "python-dotenv>=1.0",
    "fusion-solar-py>=0.1.1",
    "httpx>=0.27",
    "tzdata>=2024.1",
    "firebase-admin>=6.5",
    "pillow>=12.3.0",
    "huawei-solar>=2.5.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv.sources]
