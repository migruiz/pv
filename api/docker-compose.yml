services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: pv-solar-api:latest
    container_name: pv-solar-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - pv-data:/data
      - ./firebase-sa.json:/data/firebase-sa.json:ro
    stop_grace_period: 10s

volumes:
  pv-data:
